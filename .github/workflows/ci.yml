name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only checks out and reads the repo. If a job
# ever needs more (SARIF upload, PR comments), grant it at that job's level.
permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          # agit is developed on Windows; paths and line endings must keep working there.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  checks:
    name: typecheck · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # The project's own guarantee, exercised through the real CLI: importing the
  # committed fixture must produce a valid hash chain AND byte-identical output
  # to the committed golden log. Catches any refactor that silently changes
  # canonical serialization, hashing, redaction, or the adapter mapping.
  verify-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: import fixture and verify its chain
        run: |
          node dist/cli.js import fixtures/claude-code/simple.jsonl --dir /tmp/agit-ci
          node dist/cli.js verify fixture-simple-0001 --dir /tmp/agit-ci
      - name: compare against the committed golden log
        run: |
          diff /tmp/agit-ci/.agit/sessions/fixture-simple-0001/events.jsonl \
               fixtures/claude-code/simple.golden.jsonl
      - name: import the LangGraph fixture and compare against its golden log
        run: |
          node dist/cli.js import fixtures/langgraph/simple.sqlite --dir /tmp/agit-ci
          node dist/cli.js verify thread-agit-fixture-0001 --dir /tmp/agit-ci
          diff /tmp/agit-ci/.agit/sessions/thread-agit-fixture-0001/events.jsonl \
               fixtures/langgraph/simple.golden.jsonl
      - name: import the Cline task directory and compare against its golden log
        run: |
          node dist/cli.js import fixtures/cline-classic/1736589300000 --dir /tmp/agit-ci
          node dist/cli.js verify 1736589300000 --dir /tmp/agit-ci
          diff /tmp/agit-ci/.agit/sessions/1736589300000/events.jsonl \
               fixtures/cline-classic/1736589300000.golden.jsonl
